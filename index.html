function sprite(k,x,y,w,h,angle=0,flip=1,bob=0){const im=sprites[k];if(!im.complete||!im.naturalWidth)return false;g.save();g.translate(x,y+bob);g.rotate(angle);g.scale(flip,1);g.drawImage(im,-w/2,-h/2,w,h);g.restore();return true;}
let heroAnim=0,attackAnim=0,hitFlash=0,enemyHit=new WeakMap();
function drawAnimatedHero(){
 const moving=Math.hypot(move.x,move.y)>.10;
 const phase=heroAnim,step=moving?Math.sin(phase):0,face=move.x<-.1?-1:1;
 const x=hero.x,y=hero.y-4;
 const im=sprites.hero;
 if(!im?.complete||!im.naturalWidth){drawHero(hero.x,hero.y);return}

 // Footsteps are drawn as alternating frames rather than sliding the whole sprite.

 for(const side of [-1,1]){
   let lift=moving?Math.max(0,step*side)*6:0;
   let stride=moving?step*side*5:0;
   g.beginPath();g.ellipse(side*11+stride,31-lift,7,10,-side*.18,0,Math.PI*2);g.fill();g.stroke();
 }
 const bounce=moving?Math.abs(step)*3:Math.sin(elapsed*3)*1.2;
 g.drawImage(im,-38,-39-bounce,76,76);

   let p=1-attackAnim/.28,ang=-1.45+p*2.7;
   g.save();g.translate(19,1-bounce);g.rotate(ang);
   g.strokeStyle='rgba(99,226,255,'+(1-p)+')';g.lineWidth=9;g.beginPath();g.arc(0,0,45,-.45,.45);g.stroke();

   g.beginPath();g.moveTo(0,-7);g.lineTo(38,-4);g.lineTo(56,0);g.lineTo(38,4);g.lineTo(0,7);g.closePath();g.fill();g.stroke();
   g.restore();
 }

}
function drawAnimatedMonster(m){

}

for(const m of monsters){let a=Math.atan2(hero.y-m.y,hero.x-m.x);m.x+=Math.cos(a)*m.speed*dt;m.y+=Math.sin(a)*m.speed*dt;if(Math.hypot(m.x-hero.x,m.y-hero.y)<29){hero.hp-=24*dt;hitFlash=Math.max(hitFlash,.10);if(hero.hp<=0){run=false;document.querySelector('#over').style.display='flex';document.querySelector('#score').textContent=kills+' canavar · '+Math.floor(elapsed)+' saniye'}}}
for(let i=bullets.length-1;i>=0;i--){let b=bullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;let hit=false;for(let j=monsters.length-1;j>=0;j--){let m=monsters[j];if(Math.hypot(m.x-b.x,m.y-b.y)<20){m.hp--;hit=true;if(m.hp<=0){monsters.splice(j,1);kills++;xp++;if(xp>=level*5){xp=0;level++;hero.max+=10;hero.hp=Math.min(hero.max,hero.hp+25)}}break}}if(hit||b.life<0)bullets.splice(i,1)}}
g.fillStyle='#101e2b';g.fillRect(0,0,w,h);g.strokeStyle='#ffffff0c';for(let x=0;x<w;x+=42){g.beginPath();g.moveTo(x,0);g.lineTo(x,h);g.stroke()}for(let y=0;y<h;y+=42){g.beginPath();g.moveTo(0,y);g.lineTo(w,y);g.stroke()}for(const m of monsters)drawAnimatedMonster(m);for(const b of bullets){if(!sprite('bullet',b.x,b.y,50,26,Math.atan2(b.vy,b.vx)))drawMagic(b);}drawAnimatedHero();document.querySelector('#stats').innerHTML='❤️ '+Math.max(0,Math.ceil(hero.hp))+'/'+hero.max+'<br>⭐ Seviye '+level+' · XP '+xp+'/'+(level*5)+'<br>☠️ '+kills+' · ⏱️ '+Math.floor(elapsed)+' sn';requestAnimationFrame(tick)}requestAnimationFrame(tick);
