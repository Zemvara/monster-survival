<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Monster Survival</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#112b28;color:white;font-family:system-ui;touch-action:none}canvas{display:block;width:100vw;height:100dvh}#hud{position:fixed;top:15px;left:15px;font-weight:800;text-shadow:0 2px 5px #000;font-size:17px}#stick{position:fixed;left:30px;bottom:35px;width:130px;height:130px;border:2px solid #fff6;border-radius:50%;background:#ffffff18}#nub{position:absolute;left:38px;top:38px;width:50px;height:50px;border-radius:50%;background:#a5dfff}#end{display:none;position:fixed;inset:0;align-items:center;justify-content:center;background:#07131cd9}#panel{text-align:center;background:#253d4c;padding:30px;border-radius:22px}button{padding:12px 25px;border:0;border-radius:12px;background:#63c4ff;font-size:18px;font-weight:bold}</style></head><body><canvas id="game"></canvas><div id="hud"></div><div id="stick"><div id="nub"></div></div><div id="end"><div id="panel"><h1>OYUN BİTTİ</h1><p id="result"></p><button onclick="reset()">Yeniden Oyna</button></div></div><script>
const c=document.querySelector('#game'),g=c.getContext('2d'),hud=document.querySelector('#hud'),stick=document.querySelector('#stick'),nub=document.querySelector('#nub');let w,h,scale;function resize(){scale=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*scale;c.height=h*scale;g.setTransform(scale,0,0,scale,0,0)}onresize=resize;resize();
let p,foes,balls,kills,xp,lvl,time,spawn,fire,last,playing,motion={x:0,y:0},pointer=null;
function reset(){p={x:w/2,y:h/2,hp:100,max:100,face:1,step:0,attack:0};foes=[];balls=[];kills=0;xp=0;lvl=1;time=0;spawn=0;fire=0;playing=true;last=performance.now();document.querySelector('#end').style.display='none'}reset();
function stickMove(e){let r=stick.getBoundingClientRect(),x=e.clientX-r.left-65,y=e.clientY-r.top-65,d=Math.hypot(x,y)||1,k=Math.min(d,42)/42;motion={x:x/d*k,y:y/d*k};nub.style.transform='translate('+motion.x*42+'px,'+motion.y*42+'px)'}stick.onpointerdown=e=>{pointer=e.pointerId;stick.setPointerCapture(pointer);stickMove(e)};stick.onpointermove=e=>{if(e.pointerId===pointer)stickMove(e)};function stop(e){if(e.pointerId===pointer){motion={x:0,y:0};pointer=null;nub.style.transform=''}}stick.onpointerup=stop;stick.onpointercancel=stop;
function ellipse(x,y,rx,ry,col){g.fillStyle=col;g.beginPath();g.ellipse(x,y,rx,ry,0,0,Math.PI*2);g.fill()}function circle(x,y,r,col){g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,7);g.fill()}
function hero(){let moving=Math.hypot(motion.x,motion.y)>.09;let st=moving?Math.sin(p.step):0;g.save();g.translate(p.x,p.y);g.scale(p.face,1);ellipse(0,26,23,7,'#04121088');for(let side of [-1,1]){let lift=Math.max(0,st*side)*9,shift=st*side*7;g.save();g.translate(side*11+shift,17-lift);g.rotate(st*side*.14);ellipse(0,7,9,13,'#613e2c');ellipse(0,10,8,8,'#a56a38');ellipse(0,5,6,3,'#eac06a');g.restore()}let bob=moving?Math.abs(st)*3:Math.sin(time*4)*1.1;g.translate(0,-bob);ellipse(0,6,20,22,'#0d4fbc');ellipse(0,10,16,17,'#236fe5');ellipse(-17,8,8,12,'#805032');ellipse(17,8,8,12,'#805032');ellipse(0,-13,20,22,'#f2bc8e');ellipse(0,-28,22,13,'#f1d3a1');ellipse(-14,-30,12,9,'#fff0c9');ellipse(5,-35,14,12,'#ffe7b2');ellipse(17,-29,9,10,'#e8c18b');ellipse(-8,-12,5,6,'white');ellipse(8,-12,5,6,'white');circle(-7,-12,2.6,'#1885e9');circle(8,-12,2.6,'#1885e9');g.strokeStyle='#493025';g.lineWidth=3;g.beginPath();g.moveTo(-14,-22);g.lineTo(-4,-20);g.moveTo(4,-20);g.lineTo(14,-22);g.stroke();g.fillStyle='#d7b16f';g.fillRect(-18,20,36,5);g.fillStyle='#a46531';g.fillRect(-6,18,12,8);
let swing=p.attack>0?(1-p.attack/.3)*2.6-1.5:-.45;g.save();g.translate(18,3);g.rotate(swing);g.fillStyle='#f7f5dc';g.fillRect(1,-3,29,6);g.fillStyle='#96eaff';g.beginPath();g.moveTo(27,-6);g.lineTo(49,0);g.lineTo(27,6);g.fill();if(p.attack>0){g.strokeStyle='#9feaffbb';g.lineWidth=5;g.beginPath();g.arc(0,0,47,-.7,.55);g.stroke()}g.restore();g.restore()}
function monster(m){g.save();g.translate(m.x,m.y+Math.sin(time*7+m.seed)*3);g.rotate(Math.sin(time*6+m.seed)*.06);ellipse(0,17,17,6,'#0005');circle(0,0,19,'#a22236');circle(0,-4,17,'#fb5155');g.fillStyle='#ffe0af';g.beginPath();g.moveTo(-14,-10);g.lineTo(-13,-30);g.lineTo(-3,-15);g.moveTo(14,-10);g.lineTo(13,-30);g.lineTo(3,-15);g.fill();ellipse(-6,-4,5,6,'#fff');ellipse(6,-4,5,6,'#fff');circle(-5,-3,2.5,'#422132');circle(5,-3,2.5,'#422132');ellipse(0,9,7,4,'#6e1627');g.restore()}
function draw(){g.fillStyle='#173c30';g.fillRect(0,0,w,h);g.strokeStyle='#8bbc7455';g.lineWidth=1;for(let x=0;x<w;x+=54){g.beginPath();g.moveTo(x,0);g.lineTo(x,h);g.stroke()}for(let y=0;y<h;y+=54){g.beginPath();g.moveTo(0,y);g.lineTo(w,y);g.stroke()}for(let i=0;i<35;i++){let x=(i*167+42)%w,y=(i*289+67)%h;g.strokeStyle='#326b47';g.beginPath();g.moveTo(x,y);g.lineTo(x-3,y-8);g.moveTo(x,y);g.lineTo(x+4,y-7);g.stroke()}for(const m of foes)monster(m);for(const b of balls){g.save();g.translate(b.x,b.y);g.rotate(Math.atan2(b.vy,b.vx));ellipse(-8,0,16,5,'#158eff');circle(0,0,8,'#65deff');circle(2,-1,4,'#fff');g.restore()}hero()}
function loop(t){let dt=Math.min((t-last)/1000,.05);last=t;if(playing){time+=dt;p.attack=Math.max(0,p.attack-dt);let moving=Math.hypot(motion.x,motion.y)>.09;if(moving)p.step+=dt*13;p.x=Math.min(w-30,Math.max(30,p.x+motion.x*220*dt));p.y=Math.min(h-35,Math.max(35,p.y+motion.y*220*dt));if(Math.abs(motion.x)>.1)p.face=motion.x<0?-1:1;spawn-=dt;fire-=dt;if(spawn<=0){let side=Math.floor(Math.random()*4);foes.push({x:side===0?-25:side===1?w+25:Math.random()*w,y:side===2?-25:side===3?h+25:Math.random()*h,speed:48+time*.5,hp:1+Math.floor(time/48),seed:Math.random()*10});spawn=Math.max(.25,1.25-time*.009)}if(fire<=0&&foes.length){let m=foes.reduce((a,b)=>(a.x-p.x)**2+(a.y-p.y)**2<(b.x-p.x)**2+(b.y-p.y)**2?a:b),a=Math.atan2(m.y-p.y,m.x-p.x);balls.push({x:p.x,y:p.y,vx:Math.cos(a)*430,vy:Math.sin(a)*430,life:1.7});p.attack=.3;fire=Math.max(.2,.66-lvl*.03)}for(const m of foes){let a=Math.atan2(p.y-m.y,p.x-m.x);m.x+=Math.cos(a)*m.speed*dt;m.y+=Math.sin(a)*m.speed*dt;if(Math.hypot(p.x-m.x,p.y-m.y)<31){p.hp-=26*dt;if(p.hp<=0){p.hp=0;playing=false;document.querySelector('#end').style.display='flex';document.querySelector('#result').textContent=kills+' canavar · '+Math.floor(time)+' saniye'}}}for(let i=balls.length-1;i>=0;i--){let b=balls[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;let hit=false;for(let j=foes.length-1;j>=0;j--){if(Math.hypot(b.x-foes[j].x,b.y-foes[j].y)<20){hit=true;if(--foes[j].hp<=0){foes.splice(j,1);kills++;if(++xp>=lvl*5){lvl++;xp=0;p.max+=10;p.hp=Math.min(p.max,p.hp+25)}}break}}if(hit||b.life<=0)balls.splice(i,1)}}draw();hud.innerHTML='❤️ '+Math.ceil(p.hp)+'/'+p.max+'<br>⭐ Seviye '+lvl+' · XP '+xp+'/'+(lvl*5)+'<br>💀 '+kills+' · ⏱️ '+Math.floor(time)+' sn';requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
