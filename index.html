<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Monster Survival</title><style>*{box-sizing:border-box}body{margin:0;background:#0d1927;color:white;font-family:system-ui;overflow:hidden;touch-action:none}canvas{display:block}#stats{position:fixed;top:12px;left:12px;font-weight:bold;text-shadow:0 2px 4px black}#joy{position:fixed;bottom:35px;left:25px;width:130px;height:130px;border:2px solid #ffffff66;background:#ffffff18;border-radius:50%;touch-action:none}#dot{width:52px;height:52px;position:absolute;left:37px;top:37px;background:#79caff;border-radius:50%}#over{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center;text-align:center}#panel{background:#23384f;padding:30px;border-radius:18px}button{background:#64c8ff;border:0;padding:14px 25px;border-radius:12px;font-size:18px;font-weight:700}</style></head><body><canvas id="c"></canvas><div id="stats"></div><div id="joy"><div id="dot"></div></div><div id="over"><div id="panel"><h1>OYUN BİTTİ</h1><p id="score"></p><button onclick="reset()">Yeniden Oyna</button></div></div><script>
const c=document.querySelector('#c'),g=c.getContext('2d'),joy=document.querySelector('#joy'),dot=document.querySelector('#dot');let w,h,hero,monsters,bullets,elapsed,kills,level,xp,spawn,fire,run,last,dir={x:0,y:0};function resize(){w=c.width=innerWidth;h=c.height=innerHeight}onresize=resize;resize();
function reset(){hero={x:w/2,y:h/2,hp:100,max:100};monsters=[];bullets=[];elapsed=0;kills=0;level=1;xp=0;spawn=0;fire=0;run=true;last=performance.now();document.querySelector('#over').style.display='none'}reset();
let pointer=null;function move(e){let r=joy.getBoundingClientRect(),x=e.clientX-(r.left+65),y=e.clientY-(r.top+65),l=Math.hypot(x,y)||1,dist=Math.min(l,40);dir={x:x/l*dist/40,y:y/l*dist/40};dot.style.transform='translate('+dir.x*40+'px,'+dir.y*40+'px)'}joy.onpointerdown=e=>{pointer=e.pointerId;joy.setPointerCapture(pointer);move(e)};joy.onpointermove=e=>{if(e.pointerId===pointer)move(e)};function stop(e){if(e.pointerId===pointer){pointer=null;dir={x:0,y:0};dot.style.transform=''}}joy.onpointerup=stop;joy.onpointercancel=stop;
function circle(x,y,r,color){g.fillStyle=color;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill()}
function tick(t){let dt=Math.min((t-last)/1000,.05);last=t;if(run){elapsed+=dt;hero.x=Math.max(16,Math.min(w-16,hero.x+dir.x*210*dt));hero.y=Math.max(16,Math.min(h-16,hero.y+dir.y*210*dt));spawn-=dt;fire-=dt;if(spawn<=0){let side=Math.floor(Math.random()*4),x=side===0?-25:side===1?w+25:Math.random()*w,y=side===2?-25:side===3?h+25:Math.random()*h;monsters.push({x,y,hp:1+Math.floor(elapsed/50),speed:50+elapsed*.4});spawn=Math.max(.3,1.4-elapsed*.009)}if(fire<=0&&monsters.length){let target=monsters.reduce((a,b)=>Math.hypot(a.x-hero.x,a.y-hero.y)<Math.hypot(b.x-hero.x,b.y-hero.y)?a:b);let a=Math.atan2(target.y-hero.y,target.x-hero.x);bullets.push({x:hero.x,y:hero.y,vx:Math.cos(a)*420,vy:Math.sin(a)*420,life:2});fire=Math.max(.2,.7-level*.025)}
for(const m of monsters){let a=Math.atan2(hero.y-m.y,hero.x-m.x);m.x+=Math.cos(a)*m.speed*dt;m.y+=Math.sin(a)*m.speed*dt;if(Math.hypot(m.x-hero.x,m.y-hero.y)<29){hero.hp-=24*dt;if(hero.hp<=0){run=false;document.querySelector('#over').style.display='flex';document.querySelector('#score').textContent=kills+' canavar · '+Math.floor(elapsed)+' saniye'}}}
for(let i=bullets.length-1;i>=0;i--){let b=bullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;let hit=false;for(let j=monsters.length-1;j>=0;j--){let m=monsters[j];if(Math.hypot(m.x-b.x,m.y-b.y)<20){m.hp--;hit=true;if(m.hp<=0){monsters.splice(j,1);kills++;xp++;if(xp>=level*5){xp=0;level++;hero.max+=10;hero.hp=Math.min(hero.max,hero.hp+25)}}break}}if(hit||b.life<0)bullets.splice(i,1)}}
g.fillStyle='#101e2b';g.fillRect(0,0,w,h);g.strokeStyle='#ffffff0c';for(let x=0;x<w;x+=42){g.beginPath();g.moveTo(x,0);g.lineTo(x,h);g.stroke()}for(let y=0;y<h;y+=42){g.beginPath();g.moveTo(0,y);g.lineTo(w,y);g.stroke()}for(const m of monsters){circle(m.x,m.y,17,'#e86977');circle(m.x-5,m.y-4,3,'white');circle(m.x+5,m.y-4,3,'white')}for(const b of bullets)circle(b.x,b.y,6,'#a3e7ff');circle(hero.x,hero.y,17,'#4bbcf0');circle(hero.x-5,hero.y-4,3,'white');circle(hero.x+5,hero.y-4,3,'white');document.querySelector('#stats').innerHTML='❤️ '+Math.max(0,Math.ceil(hero.hp))+'/'+hero.max+'<br>⭐ Seviye '+level+' · XP '+xp+'/'+(level*5)+'<br>☠️ '+kills+' · ⏱️ '+Math.floor(elapsed)+' sn';requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></body></html>
